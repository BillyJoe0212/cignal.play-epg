name: Update Daily EPG

on:
  schedule:
    # Runs at 16:00 UTC = 12:00 AM (Midnight) Manila Time
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run EPG Generator Script
        run: node update_epg.js

      - name: Commit and Push Updated EPG File
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add cignal.xml
          git diff-index --quiet HEAD || git commit -m "Auto-update EPG [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
