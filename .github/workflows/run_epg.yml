name: Update Daily EPG

on:
  schedule:
    - cron: '0 16 * * *' # Runs daily at 12:00 AM Manila Time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run EPG Script
        run: node update_epg.js

      - name: Commit and Push cignal.xml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cignal.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "Update cignal.xml [skip ci]"
          git push
