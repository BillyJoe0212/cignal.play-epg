name: Update Daily EPG

on:
  schedule:
    # Runs every 6 hours at an odd minute (e.g., :23)
    # 03:23, 09:23, 15:23, 21:23 UTC
    # 11:23 AM, 5:23 PM, 11:23 PM, 5:23 AM Manila Time
    - cron: '23 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run EPG Script
        run: node update_epg.js

      - name: Commit and Push cignal.xml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cignal.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update cignal.xml [skip ci]" && git push)
