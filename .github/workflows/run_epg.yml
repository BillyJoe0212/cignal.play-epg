name: Update Daily EPG

on:
  schedule:
    # Runs automatically every day at 00:00 UTC (8:00 AM Manila Time)
    - cron: '0 0 * * *'
  workflow_dispatch: # Keeps the manual "Run workflow" button active

permissions:
  contents: write # Grants permission to push the updated cignal.xml back to the repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run EPG Generator Script
        run: node update_epg.js

      - name: Commit and Push Updated EPG File
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add cignal.xml
          git diff-index --quiet HEAD || git commit -m "Auto-update EPG [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
